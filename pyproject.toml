[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinela"
version = "1.0.0"
description = "Plataforma SAST & DevSecOps: análise estática multi-linguagem, taint analysis, IA local e Security Gate."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "tree-sitter>=0.23",
  "tree-sitter-python>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-java>=0.23",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "celery[redis]>=5.4",
  "httpx>=0.27",
  "bandit>=1.7.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sentinela = "sentinela.cli:main"

[tool.setuptools.packages.find]
include = ["sentinela*"]

[tool.setuptools.package-data]
sentinela = ["rules/*.yml", "api/static/*", "api/static/vendor/*", "storage/migrations/*.py", "storage/migrations/versions/*.py", "storage/alembic.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["benchmark/corpus", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607", "S108", "B008", "E501", "UP042", "S104"]
