name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check sentinela tests benchmark/run_benchmark.py scripts
          ruff format --check sentinela tests benchmark/run_benchmark.py scripts
      - name: Testes
        run: pytest
      - name: Benchmark (precisão / recall)
        run: python -m benchmark.run_benchmark --markdown benchmark/RESULTS.md
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: benchmark/RESULTS.md

  imagem:
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem Docker
        run: docker build -t sentinela:ci .
      - name: Smoke test do container
        run: |
          docker run --rm sentinela:ci sentinela scan benchmark/corpus --no-fail --quiet --json /tmp/r.json
